<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>claude-drive 隱私權政策</title></head><body style="font-family:sans-serif;max-width:640px;margin:48px auto;padding:0 16px;line-height:1.7"><h1>隱私權政策</h1><p>claude-drive 僅供帳號擁有者本人使用。</p><ul><li>存取範圍：本工具經本人授權，存取本人 Google 雲端硬碟中的工作檔案，用於自動建置與更新本人的資料檔。</li><li>資料使用：讀取的資料僅用於上述用途，不出售、不分享給第三方，也不用於廣告。</li><li>資料保存：處理過程中的暫存檔於工作完成後刪除；授權憑證僅存放於本人控管的執行環境。</li><li>撤銷授權：可隨時至 Google 帳戶「第三方存取權」頁面移除本應用程式。</li></ul><p>Google API 使用遵循 Google API Services User Data Policy，包括 Limited Use 規定。</p></body></html>
